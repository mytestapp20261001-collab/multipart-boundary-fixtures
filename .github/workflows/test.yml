name: Independent tool contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12.14', '3.13.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Record exact source and runtime
        run: |
          python --version
          git rev-parse HEAD
      - name: Run independent tool tests
        run: python -B -m unittest discover -s . -p test_tool.py -v
      - name: Validate standalone source and documentation
        run: python -B scripts/validate_release.py
      - name: Run README synthetic examples and CLI checks
        run: python -B scripts/run_readme_checks.py
      - name: Confirm tests did not modify tracked files
        run: git diff --exit-code
